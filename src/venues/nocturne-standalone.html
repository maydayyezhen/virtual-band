<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080b13" />
  <title>NOCTURNE · Standalone</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b13;color:#eef2f5;font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}
    #viewport{position:fixed;inset:0;touch-action:none;cursor:grab;outline:none}#viewport.dragging{cursor:grabbing}#viewport canvas{display:block;width:100%;height:100%}
    .native-ui{position:fixed;left:24px;bottom:22px;z-index:5;display:flex;flex-direction:column;gap:9px;pointer-events:none}.native-ui>*{pointer-events:auto}
    #viewLabel{font-size:12px;letter-spacing:.08em;color:#cbd6dd;text-shadow:0 2px 10px #000}.native-cameras{display:flex;gap:6px;flex-wrap:wrap;padding:7px;border:1px solid #ffffff20;border-radius:12px;background:#0c111ddd;backdrop-filter:blur(18px);box-shadow:0 12px 40px #0007}
    .native-cameras button{height:34px;padding:0 11px;border:1px solid transparent;border-radius:8px;background:transparent;color:#b7c3ca;font-size:11px;cursor:pointer}.native-cameras button:hover{background:#ffffff0e;color:#fff}.native-cameras button.active{background:#dce7e3;color:#172327}
    .native-note{font-size:10px;color:#83949e;text-shadow:0 2px 8px #000}
    #loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#080b13;transition:opacity .5s}.loading-inner{text-align:center}.loading-name{font-size:24px;letter-spacing:.32em;font-weight:300}.loading-line{width:150px;height:1px;margin:20px auto;background:linear-gradient(90deg,transparent,#8adce8,transparent);animation:pulse 1.4s ease-in-out infinite}.loading-note{font-size:11px;letter-spacing:.12em;color:#8b9aa8}@keyframes pulse{50%{opacity:.28;transform:scaleX(.72)}}
    #toast{position:fixed;left:50%;bottom:88px;z-index:8;transform:translate(-50%,10px);padding:8px 14px;border:1px solid #ffffff24;border-radius:999px;background:#111a2bea;color:#dfe7eb;font-size:11px;opacity:0;pointer-events:none;transition:.2s}#toast.show{opacity:1;transform:translate(-50%,0)}
    .host-dummies{display:none!important}
    @media(max-width:700px){.native-ui{left:12px;right:12px;bottom:12px}.native-cameras{gap:4px}.native-cameras button{height:31px;padding:0 8px;font-size:10px}}
  </style>
</head>
<body>
  <div id="viewport" tabindex="0" aria-label="NOCTURNE 原生场景"></div>
  <div class="native-ui">
    <div id="viewLabel">场馆全景</div>
    <div class="native-cameras" aria-label="NOCTURNE 原生机位">
      <button data-native-camera="panorama" class="active">场馆全景</button>
      <button data-native-camera="stage">舞台正面</button>
      <button data-native-camera="wing">舞台侧翼</button>
      <button data-native-camera="balcony">看台视角</button>
      <button data-native-camera="reverse">回望场馆</button>
    </div>
    <div class="native-note">原生 CameraRig · 拖动环顾 · 滚轮变焦 · WASD 移动 · Q/E 升降</div>
  </div>
  <div id="toast" role="status"></div>
  <div id="loading"><div class="loading-inner"><div class="loading-name">NOCTURNE</div><div class="loading-line"></div><div class="loading-note" id="loadingNote">正在点亮原生场景</div></div></div>
  <div class="host-dummies" aria-hidden="true">
    <input id="cameraAuto" type="checkbox" />
    <button id="demoButton"></button><button id="pauseButton"></button>
    <span id="transportLabel"></span><input id="bpm" value="108" />
  </div>

  <script src="./nocturne-stage-source.js"></script>
  <script src="./nocturne-stage-source-01.js"></script>
  <script src="./nocturne-stage-source-02.js"></script>
  <script src="./nocturne-stage-source-03.js"></script>
  <script src="./nocturne-stage-source-04.js"></script>
  <script src="./nocturne-stage-source-05.js"></script>
  <script src="./nocturne-stage-source-06.js"></script>
  <script src="./nocturne-stage-source-07.js"></script>
  <script src="./nocturne-stage-source-finalize.js"></script>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.1/build/three.module.js';
    window.THREE=THREE;

    async function gunzipBase64(base64){
      if(!base64)throw new Error('NOCTURNE source payload missing');
      if(typeof DecompressionStream!=='function')throw new Error('浏览器不支持 DecompressionStream');
      const raw=atob(base64),bytes=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    }

    function bindNativeCameraButtons(app){
      document.querySelectorAll('[data-native-camera]').forEach(button=>{
        button.addEventListener('click',()=>{
          app.rig.preset(button.dataset.nativeCamera);
          document.querySelectorAll('[data-native-camera]').forEach(b=>b.classList.toggle('active',b===button));
          document.getElementById('viewport')?.focus({preventScroll:true});
        });
      });
    }

    window.addEventListener('stage-ready',event=>bindNativeCameraButtons(event.detail),{once:true});

    try{
      const source=await gunzipBase64(window.__NOCTURNE_STAGE_SOURCE_GZIP_BASE64__);
      // Only the original control-panel binding is skipped. StageEngine, venue geometry,
      // CameraRig, lighting, LED, haze, GlowPass and its own animation/render loop remain
      // the authored NOCTURNE implementation running inside this isolated iframe.
      const standalone=source.replace('          bindUI(app);','          // isolated host owns the thin UI;');
      if(standalone===source)throw new Error('NOCTURNE UI hook was not found');
      (0,Function)(standalone)();
    }catch(error){
      console.error('[NOCTURNE standalone]',error);
      const note=document.getElementById('loadingNote');if(note)note.textContent='场景未能启动：'+error.message;
      document.querySelector('.loading-line')?.style.setProperty('display','none');
    }
  </script>
</body>
</html>
