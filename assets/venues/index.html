<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b13" />
  <link rel="icon" type="image/svg+xml" href="/virtual-band-icon.svg" />
  <title>Virtual Band · Venue Library</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif; background: #080b13; color: #edf0f7; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080b13; }
    body { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
    aside { display: flex; min-height: 0; flex-direction: column; border-right: 1px solid #ffffff14; background: #0b1018; }
    .brand { padding: 20px 18px 16px; border-bottom: 1px solid #ffffff10; }
    .eyebrow { color: #718397; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 5px 0 0; font-size: 20px; font-weight: 620; }
    .list { flex: 1; min-height: 0; padding: 12px; }
    .asset { width: 100%; border: 1px solid #7fdce43d; border-radius: 10px; padding: 13px; color: inherit; text-align: left; background: #80dce40c; cursor: pointer; }
    .asset strong { display: block; font-size: 14px; }
    .asset small { display: block; margin-top: 5px; color: #8193a6; line-height: 1.45; }
    .asset .state { display: inline-block; margin-top: 9px; color: #a9e9ea; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .side-foot { padding: 14px 16px 18px; border-top: 1px solid #ffffff10; color: #718397; font-size: 11px; line-height: 1.6; }
    .side-foot a { color: #abcfd6; text-decoration: none; }
    main { min-width: 0; min-height: 0; display: grid; grid-template-rows: 46px minmax(0, 1fr); background: #060a11; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 14px; border-bottom: 1px solid #ffffff12; background: #0b1018; }
    .title { min-width: 0; display: flex; align-items: baseline; gap: 10px; }
    .title strong { font-size: 13px; letter-spacing: .08em; }
    .title span { color: #73869a; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions { display: flex; gap: 6px; }
    button, .actions a { min-height: 30px; border: 1px solid #ffffff17; border-radius: 7px; padding: 6px 9px; color: #cbd8e3; background: #ffffff08; font: inherit; font-size: 11px; text-decoration: none; cursor: pointer; }
    button:hover, .actions a:hover { background: #ffffff12; }
    .preview { min-width: 0; min-height: 0; position: relative; }
    iframe { width: 100%; height: 100%; display: block; border: 0; background: #080b13; }
    @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } aside { min-height: auto; border-right: 0; border-bottom: 1px solid #ffffff14; } .brand, .side-foot { display: none; } .list { padding: 8px; } .asset { padding: 9px 11px; } .asset small, .asset .state { display: none; } main { min-height: 0; } }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <div class="eyebrow">Assets / Venues</div>
      <h1>场景资产库</h1>
    </div>
    <div class="list">
      <button class="asset" type="button" aria-current="true">
        <strong>NOCTURNE</strong>
        <small>30 × 16 m 程序化演出空间<br />默认灯光 · LED · Haze · Glow</small>
        <span class="state">Interactive</span>
      </button>
    </div>
    <div class="side-foot">Venue Asset 独立运行，不与 Studio Runtime 共享 renderer。<br /><br /><a href="/">← Workspace</a></div>
  </aside>
  <main>
    <div class="toolbar">
      <div class="title"><strong>NOCTURNE</strong><span>stage surface Y=1.2m · open X −12…12 · Z −5.4…6.6</span></div>
      <div class="actions"><button id="reload" type="button">重新载入</button><a href="/assets/venues/nocturne/" target="_blank" rel="noopener">单独打开</a></div>
    </div>
    <div class="preview"><iframe id="venuePreview" src="/assets/venues/nocturne/" title="NOCTURNE 场景资产预览"></iframe></div>
  </main>
  <script>
    const frame = document.getElementById('venuePreview');
    document.getElementById('reload').addEventListener('click', () => {
      frame.src = '/assets/venues/nocturne/?reload=' + Date.now();
    });
  </script>
</body>
</html>
