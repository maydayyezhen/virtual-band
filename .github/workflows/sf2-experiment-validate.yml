name: SF2 experiment validate

on:
  push:
    branches:
      - experiment/sf2-backend

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run sf2:fetch
      - run: npm run sf2:verify
